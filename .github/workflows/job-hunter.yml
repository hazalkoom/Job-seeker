name: Job Hunter Autopilot

on:
  schedule:
    # Four runs per Cairo day; GitHub Actions owns the schedule, not the local machine.
    - cron: "17 3,9,15,21 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare the queue, or submit one reviewed application"
        type: choice
        options: [prepare, submit-one]
        default: prepare
      queue_id:
        description: "Required for submit-one"
        type: string
      legacy_run_id:
        description: "Reviewed prior run containing job-hunter-db (first migration only)"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: job-hunter-production
  cancel-in-progress: false

jobs:
  hunt-and-apply:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.JOBHUNTER_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: job-hunter-production
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: state/jobs.sqlite3
      WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
      OPERATION: ${{ inputs.operation || 'scheduled' }}
      TARGET_QUEUE_ID: ${{ inputs.queue_id }}
      LEGACY_RUN_ID: ${{ inputs.legacy_run_id }}

      # Automatic submission: bounded to 50 confirmed applications per Cairo day.
      AUTO_APPLY_ENABLED: "true"
      AUTO_APPLY_MAX_PER_DAY: "50"
      AUTO_APPLY_MIN_SCORE: "60"
      ALLOW_UNSPECIFIED_REMOTE: "true"
      AUTO_APPLY_UNSPECIFIED_REMOTE_MIN_SCORE: "70"
      AUTO_APPLY_MAX_PER_COMPANY_30D: "2"
      AUTO_APPLY_DELAY_SECONDS: "8"
      AUTO_APPLY_HEADLESS: "true"
      AUTO_APPLY_TIMEOUT_SECONDS: "30"
      AUTO_APPLY_AUDIT_LOG_PATH: logs/application_automation.jsonl
      AUTO_APPLY_REPORT_PATH: logs/latest_run_report.json
      AUTO_APPLY_RESUME_PATH: private/Mohamed_Ahmed-general.pdf

      MIN_MATCH_SCORE: "70"
      MAX_POSTING_AGE_DAYS: "7"
      MAX_REQUIRED_EXPERIENCE_YEARS: "2"
      REQUIRE_FULL_DESCRIPTION_FOR_MATCH: "true"
      NOTIFY_REVIEW_CANDIDATES: "false"
      REVIEW_DIGEST_SIZE: "5"
      REQUEST_TIMEOUT_SECONDS: "18"

      ENABLE_ARBEITNOW: "true"
      ENABLE_REMOTEOK: "true"
      ENABLE_REMOTIVE: "true"
      ENABLE_HIMALAYAS: "true"
      ENABLE_JOBICY: "true"
      ENABLE_GOOGLE_JOBS: "true"
      ENABLE_EUROPEAN_TECH_OPPORTUNITIES: "true"
      EUROPEAN_TECH_OPPORTUNITIES_MAX_PAGES: "3"
      ENABLE_NOMADO24: "true"
      NOMADO24_LANGUAGE: "en"
      NOMADO24_MAX_PAGES: "1"
      NOMADO24_SEARCH_TERMS: "junior;entry level;graduate;internship;trainee;no experience;junior backend;junior python"
      ENABLE_GREENHOUSE: "true"
      ENABLE_LEVER: "true"
      ENABLE_ASHBY: "true"
      ENABLE_CAREER_PAGES: "true"
      ENABLE_EMAIL_ALERTS: "true"
      ENABLE_RSS_FEEDS: "true"

      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GOOGLE_JOBS_FIXED_QUERY: >-
        ("junior backend developer" OR "junior backend engineer" OR "junior full stack developer" OR "junior full-stack developer") Egypt
      GOOGLE_JOBS_ROTATING_QUERIES: >-
        ("junior Node.js developer" OR "junior Node.js engineer") Egypt;
        ("junior Python developer" OR "junior Python engineer") Egypt;
        ("junior Django developer" OR "junior FastAPI developer") Egypt;
        ("junior Angular developer" OR "junior React developer") Egypt;
        ("entry level software engineer" OR "graduate software engineer") Egypt;
        ("software engineering intern" OR "backend developer intern") Egypt;
        ("associate software engineer" OR "trainee software developer") Egypt;
        ("junior AI application engineer" OR "junior AI engineer" OR "junior LLM engineer") Egypt;
        ("junior backend developer" OR "junior backend engineer") Cairo;
        ("junior backend developer" OR "junior backend engineer") remote worldwide;
        ("junior Python developer" OR "junior Python engineer") remote worldwide;
        ("junior Node.js developer" OR "junior Node.js engineer") remote worldwide;
        ("junior full stack developer" OR "junior full-stack developer") remote worldwide;
        ("graduate software engineer" OR "entry level software engineer") remote worldwide;
        ("software engineer intern" OR "backend developer intern") remote worldwide;
        ("junior AI application engineer" OR "junior LLM engineer") remote worldwide;
        "work from anywhere" junior software developer;
        ("junior backend developer" OR "junior full stack developer") remote Europe;
        ("junior software developer" OR "entry level software engineer") remote EMEA;
        "AI coding tasks" software engineer remote;
        ("junior developer" OR "software engineer intern") remote Poland;
        ("junior developer" OR "software engineer intern") remote Germany;
        ("junior developer" OR "software engineer intern") remote Netherlands;
        ("junior developer" OR "software engineer intern") remote France;
        ("junior developer" OR "software engineer intern") remote Greece;
        ("junior backend developer" OR "junior software engineer") remote Egypt;
        ("junior backend developer" OR "junior software engineer") Mansoura

      GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
      LEVER_SITES: ${{ vars.LEVER_SITES }}
      ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
      CAREER_PAGES: ${{ vars.CAREER_PAGES }}
      RSS_FEEDS: ${{ vars.RSS_FEEDS || 'We Work Remotely Backend|https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss;We Work Remotely Full Stack|https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss;Startup Jobs Remote Engineering|https://startup.jobs/feeds/jobs?role=engineering&workplace=remote' }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_ALERTS_USERNAME: ${{ secrets.EMAIL_ALERTS_USERNAME }}
      EMAIL_ALERTS_PASSWORD: ${{ secrets.EMAIL_ALERTS_PASSWORD }}
      EMAIL_ALERTS_IMAP_HOST: imap.gmail.com
      EMAIL_ALERTS_IMAP_PORT: "993"
      EMAIL_ALERTS_MAILBOX: INBOX
      EMAIL_ALERTS_LOOKBACK_DAYS: "14"
      EMAIL_ALERTS_MAX_MESSAGES: "300"

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore encrypted candidate profile, answer bank and CV
        env:
          AUTOPILOT_DECRYPTION_PASSPHRASE: ${{ secrets.AUTOPILOT_DECRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$AUTOPILOT_DECRYPTION_PASSPHRASE" || {
            echo "Missing Actions secret AUTOPILOT_DECRYPTION_PASSPHRASE" >&2
            exit 1
          }
          for file in \
            private/candidate_profile.json.gpg \
            private/application_answers.json.gpg \
            private/Mohamed_Ahmed-general.pdf.gpg; do
            test -s "$file" || { echo "Missing encrypted file: $file" >&2; exit 1; }
          done
          mkdir -p private "$RUNNER_TEMP"
          passfile="$RUNNER_TEMP/autopilot-passphrase"
          umask 077
          printf '%s' "$AUTOPILOT_DECRYPTION_PASSPHRASE" > "$passfile"
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output candidate_profile.json --decrypt private/candidate_profile.json.gpg
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output application_answers.json --decrypt private/application_answers.json.gpg
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output private/Mohamed_Ahmed-general.pdf --decrypt private/Mohamed_Ahmed-general.pdf.gpg
          rm -f "$passfile"
          chmod 600 candidate_profile.json application_answers.json private/Mohamed_Ahmed-general.pdf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/ci-3.12.txt
          python -m playwright install --with-deps chromium

      - name: Generate role-tailored CVs
        run: python scripts/generate_tailored_cvs.py

      - name: Validate private application profile
        run: |
          python - <<'PY'
          from app.application_profile import load_profile_bundle
          bundle = load_profile_bundle()
          if bundle.issues:
              raise SystemExit("Candidate profile/answer bank validation failed: " + "; ".join(bundle.issues))
          print("Candidate profile and answer bank: valid (private values not printed)")
          PY

      - name: Validate requested operation
        run: |
          [[ "$WORKFLOW_ATTEMPT" = 1 ]] || { echo "Start a new dispatch to preserve submission history" >&2; exit 1; }
          if [[ "$OPERATION" = submit-one ]]; then
            [[ "$TARGET_QUEUE_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Provide a valid queue ID" >&2; exit 1; }
            test -z "$LEGACY_RUN_ID" || { echo "Migrate in prepare mode first" >&2; exit 1; }
          else
            test -z "$TARGET_QUEUE_ID" || { echo "Queue ID is for submit-one only" >&2; exit 1; }
          fi

      - name: Find trusted state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const history = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'job-hunter.yml', branch: 'main',
              status: 'completed', per_page: 100,
            });
            const earlier = history.filter(run => run.id < context.runId)
              .sort((left, right) => right.id - left.id);
            let legacy = process.env.LEGACY_RUN_ID;
            if (legacy && !/^[0-9]+$/.test(legacy)) throw Error('Invalid legacy run ID');
            for (const run of earlier) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...repo, run_id: run.id, per_page: 100,
              });
              const pick = kind => artifacts.find(item =>
                !item.expired && item.name === `job-hunter-state-${kind}-${run.id}-1`);
              const checkpoint = pick('final') || pick('reserved');
              if (checkpoint) {
                if (legacy) throw Error('An encrypted state already exists. Clear legacy_run_id.');
                core.setOutput('run_id', String(run.id));
                core.setOutput('kind', pick('final') ? 'final' : 'reserved');
                core.setOutput('artifact', checkpoint.name);
                core.setOutput('fallback', pick('final') && pick('reserved') ? pick('reserved').name : '');
                return;
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, per_page: 100, filter: 'all',
              });
              if (jobs.some(job => job.steps?.some(step =>
                step.name === 'Submit reserved applications' && step.started_at &&
                step.conclusion !== 'skipped'))) {
                throw Error(`Cannot restore state for submission run ${run.id}`);
              }
              if (legacy === String(run.id)) {
                if (process.env.OPERATION !== 'prepare') throw Error('Legacy import requires prepare');
                if (!artifacts.some(item => item.name === 'job-hunter-db' && !item.expired)) {
                  throw Error('Selected legacy run has no usable database');
                }
                core.setOutput('run_id', legacy);
                core.setOutput('kind', 'legacy');
                core.setOutput('artifact', 'job-hunter-db');
                return;
              }
            }
            throw Error('No trusted production state. Run prepare with a reviewed legacy snapshot.');

      - name: Download prior state
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.state.outputs.artifact }}
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/restore

      - name: Download reservation fallback
        if: steps.state.outputs.fallback != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.state.outputs.fallback }}
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/fallback

      - name: Restore application history
        env:
          JOBHUNTER_STATE_KEY: ${{ secrets.JOBHUNTER_STATE_KEY }}
          STATE_RUN_ID: ${{ steps.state.outputs.run_id }}
          STATE_KIND: ${{ steps.state.outputs.kind }}
        run: |
          file=history.sqlite3.gpg
          if [[ "$STATE_KIND" = legacy ]]; then file=jobs.sqlite3; fi
          if ! python -m app.workflow_state restore "$RUNNER_TEMP/restore/$file" --run-id "$STATE_RUN_ID" --kind "$STATE_KIND"; then
            test -f "$RUNNER_TEMP/fallback/history.sqlite3.gpg"
            python -m app.workflow_state restore "$RUNNER_TEMP/fallback/history.sqlite3.gpg" --run-id "$STATE_RUN_ID" --kind reserved
          fi

      - name: Import local attempt history
        if: steps.state.outputs.kind == 'legacy'
        env:
          JOBHUNTER_LOCAL_HISTORY: ${{ secrets.JOBHUNTER_LOCAL_HISTORY }}
        run: python -m app.workflow_state import-local

      - name: Prepare application candidates
        id: prepare
        run: |
          mkdir -p logs
          args=()
          if [[ "$OPERATION" = submit-one ]]; then args=(--queue-id "$TARGET_QUEUE_ID"); fi
          if [[ "$OPERATION" = prepare ]]; then args=(--inspect-only); fi
          python -m jobhunter run --mode prepare --output logs/workflow-report.json "${args[@]}"

      - name: Encrypt submit reservations
        if: inputs.operation != 'prepare'
        env:
          JOBHUNTER_STATE_KEY: ${{ secrets.JOBHUNTER_STATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/reserved"
          python -m app.workflow_state snapshot "$RUNNER_TEMP/reserved/history.sqlite3.gpg" --run-id "$GITHUB_RUN_ID" --kind reserved

      - name: Publish submit reservations
        if: inputs.operation != 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-state-reserved-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reserved/history.sqlite3.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Submit reserved applications
        if: inputs.operation != 'prepare'
        run: |
          args=()
          if [[ "$OPERATION" = submit-one ]]; then args=(--queue-id "$TARGET_QUEUE_ID"); fi
          python -m jobhunter run --mode submit-reserved --output logs/workflow-report.json "${args[@]}"

      - name: Encrypt final application history
        id: final
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        env:
          JOBHUNTER_STATE_KEY: ${{ secrets.JOBHUNTER_STATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          python -m app.workflow_state snapshot "$RUNNER_TEMP/final/history.sqlite3.gpg" --run-id "$GITHUB_RUN_ID" --kind final

      - name: Publish final application history
        if: always() && steps.final.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-state-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final/history.sqlite3.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        if: always() && hashFiles('logs/workflow-report.json') != ''
        run: python -m app.workflow_summary logs/workflow-report.json logs/public-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized diagnostics
        if: always() && hashFiles('logs/public-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/public-report.json
          retention-days: 14

      - name: Remove decrypted private files
        if: always()
        run: |
          rm -f candidate_profile.json application_answers.json private/Mohamed_Ahmed-general.pdf "$RUNNER_TEMP/autopilot-passphrase"
