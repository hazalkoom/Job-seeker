
name: Job Hunter

on:
  schedule:
    # 06:15 and 18:15 UTC (usually 09:15 and 21:15 in Egypt; shifts with DST).
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Persistence
      DATABASE_PATH: state/jobs.sqlite3

      # Matching and freshness
      MIN_MATCH_SCORE: "70"
      MAX_POSTING_AGE_DAYS: "7"
      NOTIFY_REVIEW_CANDIDATES: "false"
      REQUEST_TIMEOUT_SECONDS: "18"

      # Job sources
      ENABLE_ARBEITNOW: "true"
      ENABLE_REMOTEOK: "true"
      ENABLE_REMOTIVE: "true"
      ENABLE_HIMALAYAS: "true"
      ENABLE_JOBICY: "true"
      ENABLE_GOOGLE_JOBS: "true"
      ENABLE_EMAIL_ALERTS: "true"
      ENABLE_GREENHOUSE: "true"
      ENABLE_LEVER: "true"
      ENABLE_ASHBY: "true"
      ENABLE_CAREER_PAGES: "true"
      ENABLE_RSS_FEEDS: "true"

      # Google Jobs / SerpApi
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GOOGLE_JOBS_FIXED_QUERY: "junior backend developer OR junior full stack developer OR software engineer Egypt"
      GOOGLE_JOBS_ROTATING_QUERIES: "junior Node.js developer Egypt;junior Python developer Egypt;junior Django developer Egypt;junior FastAPI developer Egypt;junior Angular developer Egypt;junior backend engineer Egypt;junior full stack developer Egypt;entry level software engineer Egypt;remote junior backend developer worldwide;remote junior Python developer;remote junior Node.js developer;remote junior full stack developer;junior AI application engineer Egypt;junior LLM engineer Egypt;AI automation developer Egypt;junior developer Vodafone Egypt;junior developer Orange Egypt;junior developer Fawry Egypt;junior developer fintech Egypt;software developer Egyptian football clubs"

      # Optional source configuration: define these in GitHub repository Variables.
      GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
      LEVER_SITES: ${{ vars.LEVER_SITES }}
      ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
      CAREER_PAGES: ${{ vars.CAREER_PAGES }}
      RSS_FEEDS: ${{ vars.RSS_FEEDS }}

      # Telegram notifications
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Gmail job-alert importer
      EMAIL_ALERTS_USERNAME: ${{ secrets.EMAIL_ALERTS_USERNAME }}
      EMAIL_ALERTS_PASSWORD: ${{ secrets.EMAIL_ALERTS_PASSWORD }}
      EMAIL_ALERTS_IMAP_HOST: imap.gmail.com
      EMAIL_ALERTS_IMAP_PORT: "993"
      EMAIL_ALERTS_MAILBOX: INBOX
      EMAIL_ALERTS_LOOKBACK_DAYS: "14"
      EMAIL_ALERTS_MAX_MESSAGES: "300"

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Find previous completed run
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'job-hunter.yml',
              branch,
              per_page: 20,
            });
            const previous = result.data.workflow_runs.find(
              run => run.status === 'completed' &&
                Number(run.id) < Number(context.runId)
            );
            core.setOutput('run_id', previous ? String(previous.id) : '');

      - name: Restore SQLite history from previous run
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: job-hunter-db
          path: state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Job Hunter
        run: |
          set -o pipefail
          mkdir -p state
          python run_once.py | tee run-report.json

      - name: Add run summary
        if: always() && hashFiles('run-report.json') != ''
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("run-report.json").read_text())
          summary = [
              "# Job Hunter run",
              f"- Listings checked: {report.get('seen_after_cross_source_dedup', 0)}",
              f"- Confirmed matches: {report.get('confirmed_matches', 0)}",
              f"- Review candidates: {report.get('review_candidates', 0)}",
              f"- Newly stored: {report.get('newly_stored', 0)}",
              f"- Telegram messages sent: {report.get('telegram_messages_sent', 0)}",
              f"- Source errors: {len(report.get('source_errors', []))}",
              "",
              "## Source counts",
          ]
          summary.extend(
              f"- {name}: {count}"
              for name, count in report.get("source_counts", {}).items()
          )

          if report.get("source_errors"):
              summary.extend(["", "## Source errors"])
              summary.extend(
                  f"- {item.get('source')}: {item.get('error')}"
                  for item in report["source_errors"]
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY

      - name: Save SQLite history for next run
        if: always() && hashFiles('state/jobs.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-db
          path: state/jobs.sqlite3
          if-no-files-found: warn
          retention-days: 90
