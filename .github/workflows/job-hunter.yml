name: Job Hunter Autopilot

on:
  schedule:
    # Four runs per Cairo day; GitHub Actions owns the schedule, not the local machine.
    - cron: "17 3,9,15,21 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: job-hunter-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hunt-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: state/jobs.sqlite3

      # Automatic submission: bounded to ten confirmed applications per Cairo day.
      AUTO_APPLY_ENABLED: "true"
      AUTO_APPLY_MAX_PER_DAY: "10"
      AUTO_APPLY_MIN_SCORE: "60"
      AUTO_APPLY_DELAY_SECONDS: "8"
      AUTO_APPLY_HEADLESS: "true"
      AUTO_APPLY_TIMEOUT_SECONDS: "30"
      AUTO_APPLY_AUDIT_LOG_PATH: logs/application_automation.jsonl
      AUTO_APPLY_REPORT_PATH: logs/latest_run_report.json
      AUTO_APPLY_RESUME_PATH: private/Mohamed_Ahmed-general.pdf

      MIN_MATCH_SCORE: "70"
      MAX_POSTING_AGE_DAYS: "7"
      MAX_REQUIRED_EXPERIENCE_YEARS: "2"
      REQUIRE_FULL_DESCRIPTION_FOR_MATCH: "true"
      NOTIFY_REVIEW_CANDIDATES: "false"
      REVIEW_DIGEST_SIZE: "5"
      REQUEST_TIMEOUT_SECONDS: "18"

      ENABLE_ARBEITNOW: "true"
      ENABLE_REMOTEOK: "true"
      ENABLE_REMOTIVE: "true"
      ENABLE_HIMALAYAS: "true"
      ENABLE_JOBICY: "true"
      ENABLE_GOOGLE_JOBS: "true"
      ENABLE_EUROPEAN_TECH_OPPORTUNITIES: "true"
      EUROPEAN_TECH_OPPORTUNITIES_MAX_PAGES: "3"
      ENABLE_NOMADO24: "true"
      NOMADO24_LANGUAGE: "en"
      NOMADO24_MAX_PAGES: "1"
      NOMADO24_SEARCH_TERMS: "junior;entry level;graduate;internship;trainee;no experience;junior backend;junior python"
      ENABLE_GREENHOUSE: "true"
      ENABLE_LEVER: "true"
      ENABLE_ASHBY: "true"
      ENABLE_CAREER_PAGES: "true"
      ENABLE_EMAIL_ALERTS: "true"
      ENABLE_RSS_FEEDS: "true"

      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GOOGLE_JOBS_FIXED_QUERY: >-
        ("junior backend developer" OR "junior backend engineer" OR "junior full stack developer" OR "junior full-stack developer") Egypt
      GOOGLE_JOBS_ROTATING_QUERIES: >-
        ("junior Node.js developer" OR "junior Node.js engineer") Egypt;
        ("junior Python developer" OR "junior Python engineer") Egypt;
        ("junior Django developer" OR "junior FastAPI developer") Egypt;
        ("junior Angular developer" OR "junior React developer") Egypt;
        ("entry level software engineer" OR "graduate software engineer") Egypt;
        ("software engineering intern" OR "backend developer intern") Egypt;
        ("associate software engineer" OR "trainee software developer") Egypt;
        ("junior AI application engineer" OR "junior AI engineer" OR "junior LLM engineer") Egypt;
        ("junior backend developer" OR "junior backend engineer") Cairo;
        ("junior backend developer" OR "junior backend engineer") remote worldwide;
        ("junior Python developer" OR "junior Python engineer") remote worldwide;
        ("junior Node.js developer" OR "junior Node.js engineer") remote worldwide;
        ("junior full stack developer" OR "junior full-stack developer") remote worldwide;
        ("graduate software engineer" OR "entry level software engineer") remote worldwide;
        ("software engineer intern" OR "backend developer intern") remote worldwide;
        ("junior AI application engineer" OR "junior LLM engineer") remote worldwide;
        "work from anywhere" junior software developer;
        ("junior backend developer" OR "junior full stack developer") remote Europe;
        ("junior software developer" OR "entry level software engineer") remote EMEA;
        "AI coding tasks" software engineer remote;
        ("junior developer" OR "software engineer intern") remote Poland;
        ("junior developer" OR "software engineer intern") remote Germany;
        ("junior developer" OR "software engineer intern") remote Netherlands;
        ("junior developer" OR "software engineer intern") remote France;
        ("junior developer" OR "software engineer intern") remote Greece;
        ("junior backend developer" OR "junior software engineer") remote Egypt;
        ("junior backend developer" OR "junior software engineer") Mansoura

      GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
      LEVER_SITES: ${{ vars.LEVER_SITES }}
      ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
      CAREER_PAGES: ${{ vars.CAREER_PAGES }}
      RSS_FEEDS: ${{ vars.RSS_FEEDS || 'We Work Remotely Backend|https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss;We Work Remotely Full Stack|https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss;Startup Jobs Remote Engineering|https://startup.jobs/feeds/jobs?role=engineering&workplace=remote' }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_ALERTS_USERNAME: ${{ secrets.EMAIL_ALERTS_USERNAME }}
      EMAIL_ALERTS_PASSWORD: ${{ secrets.EMAIL_ALERTS_PASSWORD }}
      EMAIL_ALERTS_IMAP_HOST: imap.gmail.com
      EMAIL_ALERTS_IMAP_PORT: "993"
      EMAIL_ALERTS_MAILBOX: INBOX
      EMAIL_ALERTS_LOOKBACK_DAYS: "14"
      EMAIL_ALERTS_MAX_MESSAGES: "300"

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Restore encrypted candidate profile, answer bank and CV
        env:
          AUTOPILOT_DECRYPTION_PASSPHRASE: ${{ secrets.AUTOPILOT_DECRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$AUTOPILOT_DECRYPTION_PASSPHRASE" || {
            echo "Missing Actions secret AUTOPILOT_DECRYPTION_PASSPHRASE" >&2
            exit 1
          }
          for file in \
            private/candidate_profile.json.gpg \
            private/application_answers.json.gpg \
            private/Mohamed_Ahmed-general.pdf.gpg; do
            test -s "$file" || { echo "Missing encrypted file: $file" >&2; exit 1; }
          done
          mkdir -p private "$RUNNER_TEMP"
          passfile="$RUNNER_TEMP/autopilot-passphrase"
          umask 077
          printf '%s' "$AUTOPILOT_DECRYPTION_PASSPHRASE" > "$passfile"
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output candidate_profile.json --decrypt private/candidate_profile.json.gpg
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output application_answers.json --decrypt private/application_answers.json.gpg
          gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --output private/Mohamed_Ahmed-general.pdf --decrypt private/Mohamed_Ahmed-general.pdf.gpg
          rm -f "$passfile"
          chmod 600 candidate_profile.json application_answers.json private/Mohamed_Ahmed-general.pdf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate private application profile
        run: |
          python - <<'PY'
          from app.application_profile import load_profile_bundle
          bundle = load_profile_bundle()
          if bundle.issues:
              raise SystemExit("Candidate profile/answer bank validation failed: " + "; ".join(bundle.issues))
          print("Candidate profile and answer bank: valid (private values not printed)")
          PY

      - name: Run tests
        run: pytest -q

      - name: Find previous completed run
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'job-hunter.yml',
              branch,
              per_page: 20,
            });
            const previous = result.data.workflow_runs.find(
              run => run.status === 'completed' && Number(run.id) < Number(context.runId)
            );
            core.setOutput('run_id', previous ? String(previous.id) : '');

      - name: Restore SQLite history from previous run
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: job-hunter-db
          path: state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry recoverable application skips once
        # One retry lets improved public-description enrichment, apply-link discovery,
        # and the new score floor re-evaluate old skips. Unknown/foreign eligibility,
        # stale posting dates, excessive experience, CAPTCHA, and unanswered factual/legal
        # questions are still hard gates and cannot be bypassed by this requeue.
        run: |
          if [ -s state/jobs.sqlite3 ]; then
            python scripts/requeue_auto_skipped.py \
              --reason-code no_supported_ats_form \
              --reason-code application_form_not_detected \
              --reason-code description_unavailable \
              --reason-code score_below_threshold \
              --max-retries 1 --limit 60 --apply
          else
            echo "No previous SQLite state found; no diagnostic retries to requeue on the first run."
          fi

      - name: Run Job Hunter search and autopilot
        run: |
          set -euo pipefail
          mkdir -p state logs
          # Keep the unsanitized stdout report outside the workspace and never echo it.
          raw_report="$RUNNER_TEMP/job-hunter-raw-report.json"
          python run_once.py > "$raw_report"
          python - "$raw_report" <<'PY'
          import json, sys
          from pathlib import Path
          from app.automation_diagnostics import sanitize
          raw_path = Path(sys.argv[1])
          try:
              report = json.loads(raw_path.read_text(encoding="utf-8"))
          finally:
              raw_path.unlink(missing_ok=True)
          if not isinstance(report, dict):
              raise SystemExit("Job Hunter returned an unexpected report format.")
          safe_report = sanitize(report)
          Path("run-report.json").write_text(
              json.dumps(safe_report, ensure_ascii=False, indent=2, default=str) + "\n",
              encoding="utf-8",
          )
          print("Job Hunter cycle completed. Only the sanitized report is printed/uploaded.")
          PY

      - name: Add run summary
        if: always() && hashFiles('run-report.json') != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("run-report.json").read_text(encoding="utf-8"))
          auto = report.get("auto_apply") or {}
          summary = [
              "# Job Hunter Autopilot run",
              f"- Unique listings: {report.get('seen_after_cross_source_dedup', 0)}",
              f"- Confirmed matches: {report.get('confirmed_matches', 0)}",
              f"- Review candidates: {report.get('review_candidates', 0)}",
              f"- Rejected: {report.get('rejected', 0)}",
              f"- Newly stored: {report.get('newly_stored', 0)}",
              "",
              "## Automatic applications",
              f"- Enabled: {bool(auto.get('enabled', False))}",
              f"- Processed: {auto.get('processed', 0)}",
              f"- Confirmed submissions: {auto.get('submitted', 0)}",
              f"- Skipped: {auto.get('skipped', 0)}",
              f"- Failed/uncertain: {auto.get('failed', 0)}",
              f"- Reason: {auto.get('reason') or auto.get('error') or '—'}",
              "",
              f"- Telegram summary sent: {report.get('auto_apply_summary_message_sent', False)}",
              f"- Source errors: {len(report.get('source_errors', []))}",
          ]
          if report.get("source_errors"):
              summary.extend(["", "## Source errors"])
              summary.extend(f"- {x.get('source')}: {x.get('error')}" for x in report["source_errors"])
          rejection_reasons = report.get("top_rejection_reasons") or []
          if rejection_reasons:
              summary.extend(["", "## Most common job qualification rejections"])
              summary.extend(f"- {item[0]}: {item[1]}" for item in rejection_reasons[:15] if isinstance(item, list) and len(item) >= 2)
          breakdown = auto.get("reason_breakdown") or {}
          if breakdown:
              summary.extend(["", "## Application skip/failure reason codes"])
              summary.extend(f"- `{code}`: {count}" for code, count in breakdown.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY

      - name: Upload redacted application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-diagnostics-${{ github.run_id }}
          path: |
            run-report.json
            logs/latest_run_report.json
            logs/application_automation.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Remove decrypted private files
        if: always()
        run: |
          rm -f candidate_profile.json application_answers.json private/Mohamed_Ahmed-general.pdf "$RUNNER_TEMP/autopilot-passphrase" "$RUNNER_TEMP/job-hunter-raw-report.json"

      - name: Save SQLite history for next run
        if: always() && hashFiles('state/jobs.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-db
          path: state/jobs.sqlite3
          if-no-files-found: warn
          retention-days: 90
